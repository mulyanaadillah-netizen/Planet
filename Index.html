<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Explorer - Interactive CSS Animation</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }

  body {
    width: 100vw;
    height: 100vh;
    background: #070709;
    color: #e0e0e0;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Stars Background */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: 
      radial-gradient(1.5px 1.5px at 10% 20%, #ffffff 100%, transparent),
      radial-gradient(1px 1px at 30% 60%, #ffffff 100%, transparent),
      radial-gradient(2px 2px at 70% 40%, #ffffff 100%, transparent),
      radial-gradient(1px 1px at 85% 80%, #ffffff 100%, transparent),
      radial-gradient(1.5px 1.5px at 50% 90%, #ffffff 100%, transparent);
    background-size: 100% 100%;
    opacity: 0.6;
    z-index: 1;
  }

  /* Header Title */
  .header-title {
    position: absolute;
    top: 30px;
    width: 100%;
    text-align: center;
    z-index: 10;
    letter-spacing: 4px;
  }
  .header-title h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #d1c7b7;
  }
  .header-title span {
    display: block;
    font-size: 0.65rem;
    color: #666;
    letter-spacing: 2px;
    margin-top: 4px;
  }

  /* Sidebar Navigation */
  .sidebar {
    position: absolute;
    left: 40px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 10;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    background: none;
    border: none;
    color: #777;
    font-size: 0.7rem;
    letter-spacing: 1.5px;
    transition: all 0.3s ease;
  }

  .nav-item .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1px solid #555;
    transition: all 0.3s ease;
  }

  .nav-item:hover, .nav-item.active {
    color: #fff;
  }

  .nav-item:hover .dot, .nav-item.active .dot {
    background: #c2a67e;
    border-color: #c2a67e;
    box-shadow: 0 0 10px rgba(194, 166, 126, 0.6);
  }

  /* Solar System Stage */
  .system-container {
    position: relative;
    width: 900px;
    height: 600px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }

  /* Orbit Rings */
  .orbit {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.08);
    transform: rotateX(72deg) rotateY(-12deg);
    transform-style: preserve-3d;
  }

  .orbit-jupiter { width: 750px; height: 750px; }
  .orbit-saturn  { width: 550px; height: 550px; }

  /* Giant Planet (Jupiter Main View) */
  .giant-planet {
    position: absolute;
    bottom: -220px;
    width: 650px;
    height: 650px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 20%, #4a3e36 0%, #1c1613 60%, #070709 90%);
    box-shadow: 
      inset 0 12px 30px rgba(230, 195, 150, 0.25),
      inset 0 -20px 50px rgba(0, 0, 0, 0.9),
      0 -10px 40px rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding-top: 60px;
    transition: transform 0.6s ease;
  }

  .planet-label {
    text-align: center;
    letter-spacing: 5px;
    color: #d8c2a3;
    text-shadow: 0 0 15px rgba(0,0,0,0.8);
  }
  .planet-label h2 {
    font-size: 1.4rem;
    font-weight: 500;
  }

  /* Floating Moons & Orbiting Bodies */
  .moon {
    position: absolute;
    border-radius: 50%;
    background: #d4cfc7;
    box-shadow: inset -3px -3px 8px rgba(0,0,0,0.7), 0 0 10px rgba(255,255,255,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }

  .moon span {
    position: absolute;
    top: -22px;
    font-size: 0.65rem;
    letter-spacing: 1.5px;
    color: #aaa;
    white-space: nowrap;
  }

  .moon-europa {
    width: 32px; height: 32px;
    top: 180px; right: 280px;
    background: radial-gradient(circle at 30% 30%, #e6ded3, #7a736a);
    animation: floatSlow 6s ease-in-out infinite alternate;
  }

  .moon-ganymede {
    width: 26px; height: 26px;
    top: 240px; right: 120px;
    background: radial-gradient(circle at 30% 30%, #c9c2b5, #544f47);
    animation: floatSlow 7s ease-in-out infinite alternate-reverse;
  }

  .moon-io {
    width: 22px; height: 22px;
    top: 280px; left: 220px;
    background: radial-gradient(circle at 30% 30%, #ded09b, #61562d);
    animation: floatSlow 5s ease-in-out infinite alternate;
  }

  .saturn-mini {
    position: absolute;
    top: 100px; right: 350px;
    width: 45px; height: 45px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #e3cbb1, #5c4e3f);
    box-shadow: inset -4px -4px 10px rgba(0,0,0,0.8);
  }
  /* Saturn Ring */
  .saturn-mini::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 85px; height: 20px;
    border: 4px solid rgba(212, 185, 150, 0.5);
    border-radius: 50%;
    transform: translate(-50%, -50%) rotate(-18deg);
  }

  /* Read More Button */
  .btn-readmore {
    position: absolute;
    bottom: 35px;
    padding: 8px 22px;
    border: 1px solid #8c7a63;
    background: rgba(15, 14, 12, 0.6);
    color: #c2ab8d;
    font-size: 0.65rem;
    letter-spacing: 2px;
    border-radius: 20px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: all 0.3s ease;
    z-index: 10;
  }
  .btn-readmore:hover {
    background: #c2ab8d;
    color: #070709;
    box-shadow: 0 0 15px rgba(194, 171, 141, 0.4);
  }

  /* Keyframe Animations */
  @keyframes floatSlow {
    0% { transform: translateY(0px); }
    100% { transform: translateY(-12px); }
  }
</style>
</head>
<body>

  <div class="stars"></div>

  <div class="header-title">
    <h1>SOLAR EXPLORER</h1>
    <span>IN ONLY CSS & JS</span>
  </div>

  <div class="sidebar">
    <button class="nav-item"><span class="dot"></span> PLUTO</button>
    <button class="nav-item"><span class="dot"></span> NEPTUNE</button>
    <button class="nav-item"><span class="dot"></span> URANUS</button>
    <button class="nav-item"><span class="dot"></span> SATURN</button>
    <button class="nav-item active"><span class="dot"></span> JUPITER</button>
    <button class="nav-item"><span class="dot"></span> MARS</button>
    <button class="nav-item"><span class="dot"></span> EARTH</button>
    <button class="nav-item"><span class="dot"></span> VENUS</button>
    <button class="nav-item"><span class="dot"></span> MERCURY</button>
  </div>

  <div class="system-container">
    <div class="orbit orbit-jupiter"></div>
    <div class="orbit orbit-saturn"></div>

    <div class="saturn-mini"></div>

    <div class="moon moon-europa" onclick="selectBody('EUROPA')">
      <span>EUROPA</span>
    </div>
    <div class="moon moon-ganymede" onclick="selectBody('GANYMEDE')">
      <span>GANYMEDE</span>
    </div>
    <div class="moon moon-io" onclick="selectBody('IO')">
      <span>IO</span>
    </div>

    <div class="giant-planet" id="mainPlanet">
      <div class="planet-label">
        <h2 id="planetTitle">JUPITER</h2>
      </div>
    </div>

    <button class="btn-readmore">READ MORE</button>
  </div>

<script>
  function selectBody(name) {
    const title = document.getElementById('planetTitle');
    title.innerText = name;

    // Animasi efek zoom sederhana
    const planet = document.getElementById('mainPlanet');
    planet.style.transform = 'scale(1.03)';
    setTimeout(() => {
      planet.style.transform = 'scale(1)';
    }, 300);
  }

  // Interaktivitas Sidebar
  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item => {
    item.addEventListener('click', () => {
      navItems.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      
      const planetName = item.textContent.trim();
      selectBody(planetName);
    });
  });
</script>

</body>
</html>
